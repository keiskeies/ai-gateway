name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install tauri-cli
        # 固定 2.11.5：2.12.x 依赖 zip ^8，而 zip 8.x 全系列已被 yank，导致 cargo install 失败
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Gateway ${{ github.ref_name }}'
          releaseBody: |
            下方 Assets 选择对应平台的安装包下载即可。

            ---

            ## 🆕 v1.3.1 更新内容

            - 🎛️ **控制台重设计**：运行总览 / 流量 / 虚拟模型 / 平台 / 密钥 / 监控大屏六页新信息架构，深色浅色双主题，筛选与分页写进地址
            - 🔐 **管理员登录与 Key 安全**：后台登录（Argon2id + 会话 Cookie），网关 Key 改为哈希存储、只展示一次，支持过期 / 配额 / 轮换
            - 💰 **成本与预算**：按定价表估算每次请求成本并给出覆盖率；预算配额支持滚动窗口与超额拦截
            - 🧾 **请求轨迹与重放**：每次请求的后端尝试逐条可查；正文默认不落库，开启后可原样重放
            - 🔔 **通知中心**：Key 过期、平台连续失败、配额超阈值、备份过期都会落库并实时推送，顶栏铃铛直达
            - 🗄️ **备份与迁移**：整库快照 / 下载 / 原地还原（还原前自动再留一份），配置脱敏导出导入，流量与定价 CSV
            - ♿ **无障碍与回归**：键盘可达与焦点环、axe 0 violations、20 条 Playwright E2E（含像素级视觉回归）
            - 🔤 **中文界面清理**：文案全量中英双语，字号下限 11px；移除旧版虚拟模型编辑器

            ---

            ## 🚀 软件功能介绍

            AI Gateway 是一个跨平台（macOS / Windows / Linux）的 **AI 接口聚合与负载均衡网关**，桌面 App + 独立服务器双形态，一个入口聚合所有 AI 平台。

            ### 核心能力
            - **多 Key 负载均衡**：多个 API Key 轮询/加权/分流，N 个 Key = N 倍吞吐量，突破单 Key 限流瓶颈
            - **5 种负载均衡策略**：轮询、加权随机、最少连接、优先级（主备兜底）、延迟优先
            - **OpenAI & Anthropic 双协议原生支持**：零代码改造，仅改 `base_url` 即可接入
            - **高可用自动故障切换**：后端异常 / 429 限流 / 5xx / 超时 自动重试 + 指数退避 + 切换健康后端，对应用完全透明

            ### 平台与模型
            - **15+ 平台预设**：OpenAI / Anthropic / DeepSeek / Qwen / Gemini / GLM / 月之暗面 / 豆包 / Ollama / NVIDIA NIM / Azure / SiliconFlow / Groq / 零一万物 / 百川，一键添加
            - **远程模型获取**：选择平台后自动拉取可用模型列表，下拉选择；也支持手动输入任意模型名称
            - **智能能力识别**：聊天/代码/视觉/函数调用等能力自动填充，支持手动覆盖
            - **reasoning_content 支持**：兼容 NVIDIA NIM 等平台思维链输出，自动透传

            ### 管理与易用
            - **可视化管理**：Web UI 管理平台、虚拟模型、API Key、统计概览
            - **虚拟大模型**：将多个后端 AI 模型负载均衡为统一入口，客户端按虚拟模型名请求
            - **API Key 管理**：全局通用，可选关联虚拟模型
            - **统计概览**：Token 用量与请求统计
            - **使用方式代码示例**：内置 cURL / Python / Node.js 调用示例，一键复制
            - **设置页**：端口、监听地址、日志级别、重试、超时、默认负载均衡策略均可界面配置
            - **浅色 / 深色 / 跟随系统** 三种主题
            - **中英双语** UI

            ### 技术栈
            - 后端：Rust · Actix-Web · SQLite (r2d2 连接池) · Reqwest
            - 前端：React · TypeScript · Mantine · Vite
            - 桌面端：Tauri 2.0，单二进制零依赖

            ### 快速上手
            1. 添加平台 → 选预设 + 填 API Key → 保存
            2. 创建虚拟模型 → 选策略 + 添加后端 → 启动
            3. 改 `base_url` → 指向 `http://localhost:1994/v1` → 完事
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
