name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install tauri-cli
        # 固定 2.11.5：2.12.x 依赖 zip ^8，而 zip 8.x 全系列已被 yank，导致 cargo install 失败
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Gateway ${{ github.ref_name }}'
          releaseBody: |
            下方 Assets 选择对应平台的安装包下载即可。

            ---

            ## 🆕 v1.4.3 更新内容

            - 🧩 **共享模型目录**：模型与价格按「平台类型 + 归一化 Base URL」的哈希共享，同一地址再加一把 Key 会自动带上已有的模型列表、定价与积分价，不必重抓重填；目录改一处，同地址所有账号一起生效
            - 🗂️ **目录归属与清理**：虚拟模型和后端依旧挂在具体账号上；删账号时模型先迁给同目录的兄弟账号，删掉最后一个才清理目录。数据库 V25 迁移自动回填 catalog_key 并合并重复模型行
            - 💸 **缓存分档计价**：输入价拆成缓存未命中 / 缓存命中 / 缓存写入三档，Anthropic 的 `cache_read` 与 `cache_creation` 各自算钱；未命中价继续为旧数据兜底
            - 🕐 **峰谷分时价**：模型可配高峰时段（`HH:MM-HH:MM`，支持跨零点）与高峰四档价，按请求开始时刻选档；DeepSeek 的夜间 0.02 / 白天 0.04 直接可配，定价改动只影响之后的请求，历史成本不被追溯改写
            - 🔌 **客户端接入限制为本机控制台**：只有本机回环访问才显示这一页并放行 `/api/clients/*`，远程或经 nginx 反向代理访问返回 403 —— 该页面读写的是网关所在机器上的 `~/.claude`、`~/.codex`
            - 📤 **配置与 CSV 跟进**：配置导出导入携带目录哈希与缓存/峰谷字段；定价 CSV 增加缓存命中 / 缓存写入两列

            ---

            ## 🚀 软件功能介绍

            AI Gateway 是一个跨平台（macOS / Windows / Linux）的 **AI 接口聚合与负载均衡网关**，桌面 App + 独立服务器双形态，一个入口聚合所有 AI 平台。

            ### 核心能力
            - **多 Key 负载均衡**：多个 API Key 轮询/加权/分流，在上游限额内叠加吞吐
            - **5 种负载均衡选项**：轮询、加权随机、最少连接、优先级（主备兜底）、延迟优先（当前等同轮询）
            - **OpenAI & Anthropic 双协议原生支持**：零代码改造，仅改 `base_url` 即可接入
            - **失败重试与换后端**：429 / 5xx / 408 自动重试 + 指数退避，并在同一虚拟模型的其他后端间切换；连接失败默认不重试（见 README 已知边界）
            - **请求详情与保留期**：路径、转发地址、上游模型、请求头、请求/响应正文，按天自动清理
            - **上游积分额度**：平台预算 + 模型单次积分价 + 积分感知选路 + 独立台账与告警
            - **共享模型目录与分时计费**：同 URL 的账号共用一套模型与定价；输入价分缓存三档，高峰时段单独定价，每笔请求的成本按当时定价冻结

            ### 平台与模型
            - **15 个平台预设**：OpenAI / Anthropic / DeepSeek / Qwen / Google Gemini / Groq / SiliconFlow / 智谱 GLM / 月之暗面 / 豆包 / NVIDIA / Together AI / OpenRouter / Ollama / Azure OpenAI，一键添加，也可手填任意 OpenAI / Anthropic 兼容端点
            - **远程模型获取**：选择平台后自动拉取可用模型列表，下拉选择；同一 Base URL 的账号共享这套目录，只同步一次；也支持手动输入任意模型名称
            - **能力标记**：推理 / 视觉 / 嵌入 / 重排 / 工具等能力自动填充，支持手动覆盖
            - **reasoning_content 支持**：兼容 NVIDIA NIM 等平台思维链输出，自动透传

            ### 管理与易用
            - **可视化管理**：Web UI 管理平台、虚拟模型、API Key、客户端接入、统计概览（客户端接入仅在本机控制台开放）
            - **虚拟大模型**：将多个后端 AI 模型负载均衡为统一入口，客户端按虚拟模型名请求
            - **API Key 管理**：全局通用，可选关联虚拟模型；支持到期时间、请求 / Token / 成本配额
            - **统计概览**：流量、监控大屏与 Token / 请求统计
            - **使用方式代码示例**：内置 cURL / Python / Node.js 调用示例，一键复制
            - **设置页**：端口、监听地址、日志级别、重试、超时、默认负载均衡策略均可界面配置
            - **浅色 / 深色 / 跟随系统** 三种主题
            - **中英双语** UI

            ### 技术栈
            - 后端：Rust · Actix-Web · SQLite (r2d2 连接池) · Reqwest
            - 前端：React · TypeScript · Mantine · Vite
            - 桌面端：Tauri 2（Windows 使用 WebView2）

            ### 快速上手
            1. 添加平台 → 选预设 + 填 API Key → 保存
            2. 创建虚拟模型 → 选策略 + 添加后端 → 启动
            3. 改 `base_url` → 指向 `http://localhost:1994/v1` → 完事
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
