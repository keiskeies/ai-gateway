name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否创建 Release。关闭时只出包并上传为 Actions artifact，不建 Release、不打 tag'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install tauri-cli
        # 固定 2.11.5：2.12.x 依赖 zip ^8，而 zip 8.x 全系列已被 yank，导致 cargo install 失败
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Build Tauri app
        # tag 推送永远走发布路径；手动触发时才看 publish 开关
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Gateway ${{ github.ref_name }}'
          releaseBody: |
            下方 Assets 选择对应平台的安装包下载即可。

            ---

            ## 🆕 v1.4.8 更新内容

            > 这一版带来密钥明文回显、虚拟模型级请求覆盖，以及一系列兼容性与性能修复。

            - 🔑 **密钥页显示完整 Key**：网关 API Key 创建时用 AES-GCM 加密落库（与平台凭据同一把 encrypt_key），列表与详情从此可直接查看、一键复制完整密钥；迁移前的旧 Key 从未存过明文，照旧显示掩码，轮换后即获得明文（迁移 V37）
            - 🧩 **虚拟模型级参数/请求头覆盖**：路由（= 虚拟模型）新增 param_overrides / headers，转发前 merge、可压过平台级头；backend 级覆盖仍然最后应用、保留最终决定权（迁移 V36）
            - 🧾 **vLLM 系严格模板兼容**：system 消息合并前置，修复「System must be at the beginning」类 400
            - 🔑 **Key 申请入口改本地匹配**：不再为每次输入打一次 404 查询
            - ⚡ **SSE 心跳改 Delay 策略**：LeastConnections 复用 Key 缓冲
            - 🗃️ **报表查询提速**：去重复扫描，db_info 不再读正文全文，清理加事务
            - 🎛️ **设置页布局对齐**：服务配置与请求策略等高，导出与导入配置等高

            ---

            ## 🚀 软件功能介绍

            AI Gateway 是一个跨平台（macOS / Windows / Linux）的 **AI 接口聚合与负载均衡网关**，桌面 App + 独立服务器双形态，一个入口聚合所有 AI 平台。

            ### 核心能力
            - **多 Key 负载均衡**：多个 API Key 轮询/加权/分流，在上游限额内叠加吞吐
            - **5 种负载均衡选项**：轮询、加权随机、最少连接、优先级（主备兜底）、延迟优先（当前等同轮询）
            - **OpenAI & Anthropic 双协议原生支持**：零代码改造，仅改 `base_url` 即可接入
            - **失败重试与换后端**：429 / 5xx / 408 自动重试 + 指数退避，并在同一虚拟模型的其他后端间切换；连接失败默认不重试（见 README 已知边界）
            - **请求详情与保留期**：路径、转发地址、上游模型、请求头、请求/响应正文，按天自动清理；正文超限保留前缀，请求/响应按对话、思考、工具与用量结构化展示
            - **上游积分额度**：平台预算 + 模型单次积分价 + 积分感知选路 + 独立台账与告警
            - **共享模型目录与分时计费**：同 URL 的账号共用一套模型与定价；输入价分缓存三档，高峰时段单独定价，每笔请求的成本按当时定价冻结
            - **成本监控**：大屏展示成本、覆盖率、平台成本占比、高峰状态与预算告警；未定价模型明确标记，不显示成 0

            ### 平台与模型
            - **15 个平台预设**：OpenAI / Anthropic / DeepSeek / Qwen / Google Gemini / Groq / SiliconFlow / 智谱 GLM / 月之暗面 / 豆包 / NVIDIA / Together AI / OpenRouter / Ollama / Azure OpenAI，一键添加，也可手填任意 OpenAI / Anthropic 兼容端点
            - **远程模型获取**：选择平台后自动拉取可用模型列表，下拉选择；同一 Base URL 的账号共享这套目录，只同步一次；也支持手动输入任意模型名称
            - **能力标记**：推理 / 视觉 / 嵌入 / 重排 / 工具等能力自动填充，支持手动覆盖
            - **reasoning_content 支持**：兼容 NVIDIA NIM 等平台思维链输出，自动透传

            ### 管理与易用
            - **可视化管理**：Web UI 管理平台、虚拟模型、API Key、客户端接入、统计概览（客户端接入仅在本机控制台开放）
            - **虚拟大模型**：将多个后端 AI 模型负载均衡为统一入口，客户端按虚拟模型名请求
            - **API Key 管理**：全局通用，可选关联虚拟模型；支持到期时间、请求 / Token / 成本配额
            - **统计概览**：流量、监控大屏与 Token / 请求统计
            - **使用方式代码示例**：内置 cURL / Python / Node.js 调用示例，一键复制
            - **设置页**：端口、监听地址、日志级别、重试、超时、默认负载均衡策略均可界面配置
            - **浅色 / 深色 / 跟随系统** 三种主题
            - **中英双语** UI

            ### 技术栈
            - 后端：Rust · Actix-Web · SQLite (r2d2 连接池) · Reqwest
            - 前端：React · TypeScript · Mantine · Vite
            - 桌面端：Tauri 2（Windows 使用 WebView2）

            ### 快速上手
            1. 添加平台 → 选预设 + 填 API Key → 保存
            2. 创建虚拟模型 → 选策略 + 添加后端 → 启动
            3. 改 `base_url` → 指向 `http://localhost:1994/v1` → 完事
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # 不发布时：自己出包并把安装包传成 Actions artifact（不建 Release、不打 tag）
      - name: Build Tauri app (no release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == false }}
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload installers (no release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 14
